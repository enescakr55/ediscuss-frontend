<div class="bgBackground" style="min-height: 99vh;">
  <div style="padding:30px">
    <div class="siteLogo"></div>
  <div style="text-align: center; color:white; font-weight:bold;"><font>Anasayfanızda Görmek İstediğiniz Konuları Seçin</font></div>
  <br/><br/>
  <div style="text-align: center;">
  <div *ngFor="let cs of categorySubjects">
    <div style="color:white; margin-bottom: 5px;" class="categoryText">{{cs.category.categoryName}}</div>
    <button *ngFor="let sub of cs.subject" class="ui button" style="margin-bottom: 10px;" (click)="toggleFavorites(sub.subjectId)">{{sub.subjectName}} <i *ngIf="isSelected(sub.subjectId)" style="color:green; margin-left: 3px;"class="check circle icon"></i></button>
  <br/><br/>
  </div>
  </div>
  </div>
  <hr/>
</div>
