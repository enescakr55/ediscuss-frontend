<div class="main bgBackground">
  <div class="contentMain">
  <div class="siteLogo"></div>
  <br/><br/>
  <div class="loginFormClass" style="position: relative;">
    <form [formGroup]="loginForm">
      <div class="textInput">
        <input formControlName="username" type="text" autocomplete="off" required="required">
        <span>{{"loginPage.username-placeholder" | translate}}</span>
        <i></i>
      </div>
      <div class="textInput">
        <input formControlName="password" type="password" autocomplete="current-password" required="required">
        <span>{{"loginPage.password-placeholder" | translate}}</span>
        <i></i>
      </div>
      <!--<input class="textInput" formControlName="username" type="text" placeholder="Kullanıcı Adı"/><br>
      <input class="textInput" formControlName="password" type="password" placeholder="Şifre"/> -->
    </form>
    <div class="forgotPasswordMain"><div class="forgotPassword" routerLink="/forgot-password">{{"loginPage.forgot-password-btn" | translate}} </div></div>
    <br/>
    <button class="btn bgYellow" (click)="login()" [disabled]="loading == true">{{'loginPage.login-btn' | translate}} <app-loading *ngIf="loading==true"></app-loading ></button>
    <br/>
    <button class="btn bgTransparent textYellow registerBtn" routerLink="/register" innerHTML="{{'loginPage.register-btn' | translate}}"></button>
  </div>
  </div>
</div>
